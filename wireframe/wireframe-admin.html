<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wireframe – Admin (Struktur Murni)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #e8e8e8;
      --paper: #ffffff;
      --line: #222;
      --muted: #777;
      --fill: #fafafa;
    }

    body {
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      padding: 24px;
      display: flex;
      justify-content: center;
      color: #111;
    }

    .wireframe {
      max-width: 1200px;
      width: 100%;
      background: var(--paper);
      border: 3px solid var(--line);
      padding: 20px;
    }

    /* === HEADER === */
    .header {
      border: 2px solid var(--line);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo span {
      border: 1px dashed #888;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }

    .user-area {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .box {
      border: 1px solid var(--line);
      background: var(--fill);
      min-height: 34px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #111;
      white-space: nowrap;
    }

    .box.dashed {
      border-style: dashed;
      color: #666;
    }

    /* === GRID 2 KOLOM === */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    /* === PANEL === */
    .panel {
      border: 2px solid var(--line);
      background: #fff;
      padding: 12px;
    }

    .panel-header {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 10px;
    }

    .placeholder-big {
      position: relative;
      min-height: 240px;
      border: 2px solid var(--line);
      background:
        linear-gradient(135deg, transparent calc(50% - 1px), rgba(34,34,34,0.15) calc(50% - 1px), rgba(34,34,34,0.15) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(225deg, transparent calc(50% - 1px), rgba(34,34,34,0.15) calc(50% - 1px), rgba(34,34,34,0.15) calc(50% + 1px), transparent calc(50% + 1px)),
        #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 18px;
      margin-bottom: 12px;
      color: #111;
      font-size: 16px;
      letter-spacing: 0.4px;
    }

    .placeholder-big.small {
      min-height: 180px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .actions .box {
      min-width: 130px;
      border-style: dashed;
      font-size: 12px;
    }

    .wide-panel {
      border: 2px solid var(--line);
      padding: 12px;
      margin-bottom: 18px;
    }

    .footer {
      border-top: 2px dashed #bbb;
      padding-top: 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      .header {
        flex-direction: column;
        align-items: stretch;
      }
      .user-area {
        justify-content: center;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 10px;
      }
      .wireframe {
        padding: 12px;
      }
      .placeholder-big {
        min-height: 180px;
        font-size: 14px;
      }
      .actions .box {
        min-width: 0;
        flex: 1;
      }
    }
  </style>
</head>
<body>

  <main class="wireframe">

    <!-- ===== HEADER ===== -->
    <header class="header">
      <div class="logo">
        SPK AHP
        <span>TUMPANGSARI</span>
      </div>
      <div class="user-area">
        <div class="box" style="min-width:110px;">[User]</div>
        <div class="box" style="min-width:90px;">[Logout]</div>
      </div>
    </header>

    <!-- ===== GRID 2 ===== -->
    <section class="grid-2">

      <!-- Panel A – Manajemen Alternatif -->
      <article class="panel">
        <div class="panel-header">Manajemen Alternatif</div>
        <div class="placeholder-big">
          AREA DAFTAR ALTERNATIF
        </div>
        <div class="actions">
          <div class="box dashed">+ Tambah</div>
        </div>
      </article>

      <!-- Panel B – Manajemen Pengguna -->
      <article class="panel">
        <div class="panel-header">Manajemen Pengguna</div>
        <div class="placeholder-big">
          AREA DAFTAR PENGGUNA
        </div>
        <div class="actions">
          <div class="box dashed">+ Tambah</div>
        </div>
      </article>

    </section>

    <!-- ===== PANEL C – Monitoring Penilaian Pakar ===== -->
    <section class="wide-panel">
      <div class="panel-header">Monitoring Penilaian Pakar</div>
      <div class="placeholder-big small">
        AREA MONITORING PENILAIAN
      </div>
      <div class="actions">
        <div class="box dashed">Detail</div>
        <div class="box dashed">Refresh</div>
      </div>
    </section>

  </main>

</body>
</html>
